<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Vault</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

```
<aside class="sidebar">

    <div class="logo">
        PROJECT VAULT
    </div>

    <input
        type="text"
        id="search"
        placeholder="Search snippets..."
    >

    <div id="categories"></div>

</aside>

<section class="snippet-panel">

    <div class="panel-header">
        Snippets
    </div>

    <div id="snippetList"></div>

</section>

<section class="viewer-panel">

    <div class="tabs">

        <button class="tab active" id="previewTab">
            Preview
        </button>

        <button class="tab" id="codeTab">
            Code
        </button>

    </div>

    <div id="previewArea">

        Select a snippet

    </div>

    <div id="codeArea" style="display:none;">

        <h3>HTML</h3>
        <pre id="htmlCode"></pre>

        <h3>CSS</h3>
        <pre id="cssCode"></pre>

        <h3>JS</h3>
        <pre id="jsCode"></pre>

    </div>

</section>
```

</div>

<script src="script.js"></script>

</body>
</html>
